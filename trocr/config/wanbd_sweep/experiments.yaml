# @package sweep
#
# Name: {base|small}_encoder_{trained|frozen}_lora_{trained|no}_decoder_{rand|trained}
#   encoder_trained = pretrained ViT, unfrozen
#   encoder_frozen  = pretrained ViT, frozen (LoRA may still train)
#   decoder_rand    = decoder.reinitialize: all
#   decoder_trained = decoder.reinitialize: token_layers (body kept)
#
# Old keys: base_random_full, base_pretrained_decoder, base_pretrained_lora,
# base_pretrained_full, base_random_lora

experiments:
  base_encoder_trained_lora_no_decoder_rand:
    encoder.name: base
    model.name: microsoft/trocr-base-handwritten
    model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
    model.freeze_encoder: false
    decoder.reinitialize: all
    lora_adaptors.enabled: false
  base_encoder_frozen_lora_no_decoder_trained:
    encoder.name: base
    model.name: microsoft/trocr-base-handwritten
    model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
    model.freeze_encoder: true
    decoder.reinitialize: token_layers
    lora_adaptors.enabled: false
  base_encoder_frozen_lora_trained_decoder_trained:
    encoder.name: base
    model.name: microsoft/trocr-base-handwritten
    model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
    model.freeze_encoder: true
    decoder.reinitialize: token_layers
    lora_adaptors.enabled: true
  base_encoder_trained_lora_no_decoder_trained:
    encoder.name: base
    model.name: microsoft/trocr-base-handwritten
    model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
    model.freeze_encoder: false
    decoder.reinitialize: token_layers
    lora_adaptors.enabled: false
  base_encoder_frozen_lora_trained_decoder_rand:
    encoder.name: base
    model.name: microsoft/trocr-base-handwritten
    model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
    model.freeze_encoder: true
    decoder.reinitialize: all
    lora_adaptors.enabled: true
