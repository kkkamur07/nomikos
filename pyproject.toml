# The one published distribution (ADR 0002). It carries the inference library,
# `hf://` weight resolution, and the `nomikos` console entry point; a hosted
# worker installs the same wheel a researcher does, so there is no
# version-compatibility matrix between components that always ship together.
#
# The repository root is the project because the package it publishes lives at
# `nomikos_inference/`, and a build backend cannot reach outside its own project root.
# `tool.uv.package = false` below keeps development running from the tree: the
# wheel is built explicitly (`uv build`), not installed into every dev venv.
[project]
name = "nomikos-inference"
version = "0.4.2"
description = "Manuscript segmentation and transcription runtime for the nomikos platform"
readme = "nomikos_inference/README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
# [project].dependencies is the closure that reaches a researcher's laptop.
# Anything added here is downloaded by every `uv tool install nomikos-inference`,
# so it is the runtime imports of the shipped modules and nothing else. There is
# no FastAPI, uvicorn or httpx because since #60 there is nothing under
# `nomikos_inference/` that serves HTTP: the wheel is now the whole package, with no
# excluded subtree, because the loopback surfaces that had to be excluded are
# gone (ADR 0002).
dependencies = [
    "huggingface-hub>=0.27.0",
    "numpy>=1.24.4,<2",
    # ADR 0006: ONNX Runtime is the inference runtime for both architectures,
    # CPU only. The wheel is self-contained - no CUDA variant is resolved for
    # `onnxruntime`, which is why the `--torch-backend=cpu` install ceremony
    # ADR 0004 needed is gone with it.
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=4.8,<4.13",
    "pillow>=12.3.0",
    # DB unclip in the ppocr-det segmenter: the same polygon offset PaddleX uses, for exact parity.
    "pyclipper>=1.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # The CLI's terminal output (#56). Pure Python, two small dependencies
    # (markdown-it-py, pygments), no compiled extension. It earns its place on
    # the pairing screen: the URL must survive being printed at any width, and
    # the **confirmation code** has to be the most prominent thing on it or ADR
    # 0001's anti-phishing mitigation is decoration again.
    "rich>=13.9.0",
    "scikit-image>=0.25.0",
    "scipy>=1.15.0",
    "shapely>=2.1.0",
]

[project.scripts]
# ADR 0002: local inference is a CLI, not a loopback service. `pair` and
# `version` shipped in #56, the `run` claim loop in #57; self-upgrade is #58.
nomikos = "nomikos_inference.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nomikos_inference"]
# Nothing is excluded for being a web server any more: #60 deleted
# `nomikos_inference/api` and `nomikos_inference/helper` outright, so "the published closure
# holds no web server" is now true by construction rather than by an exclude
# list somebody has to keep correct.
#
# Three trees below are the exception, and they are here on purpose. `src/hf/`,
# `src/inference/` and the Torch export tooling moved into this directory so that
# the repository has one import root instead of two, which is a question about
# where code is *edited*.
# Where code is *published* is a different question, and ADR 0002 already
# answered it: runtime `hf://` resolution ships (it is on the inference path),
# publish-side tooling, the training-stack predictors and the export tooling do
# not. Moving a directory must not silently reverse that, so each one is named
# here, and `uv build` on this commit emits the same wheel file listing, path for
# path, as the commit before it. Anything new that lands under any of those trees
# is excluded with it; a genuinely shippable module belongs somewhere else in the
# package.
exclude = [
    "/nomikos_inference/CONTEXT.md",
    # Publish-side only: staging validation, model cards, collection sync, and
    # the blob trees under `publish/artifacts/`. A researcher publishes nothing,
    # and the blobs alone are ~26 MB on top of a wheel that ADR 0006 spent real
    # effort shrinking.
    "/nomikos_inference/publish",
    # Training-stack predictors. They import `calamari_ocr` and `transformers`,
    # neither of which is in `[project].dependencies` and neither of which is
    # going to be: nothing that trains a model is part of what runs one.
    "/nomikos_inference/predictors",
    # Torch-only export tooling (ADR 0006), not on the inference path: it traces
    # the `.onnx` a researcher runs, and Torch is not in `[project].dependencies`.
    "/nomikos_inference/export",
    # Empty placeholder tree from the pre-Hub weights layout. Weights come from
    # the Hub now and are cached under the researcher's home directory.
    "**/.gitkeep",
]

[tool.hatch.build.targets.sdist]
include = [
    "/nomikos_inference",
    "/pyproject.toml",
]
# The sdist is uploaded to PyPI alongside the wheel (`uv build` in
# `.github/workflows/release.yml`), so the two trees held out of the wheel are
# held out here too. Repeated rather than hoisted into `[tool.hatch.build]`:
# hatchling lets a target's own `exclude` replace the shared one outright rather
# than adding to it, so a shared list would be silently dead for the wheel the
# moment the wheel keeps a list of its own.
exclude = [
    "/nomikos_inference/publish",
    "/nomikos_inference/predictors",
    # Torch-only export tooling (ADR 0006), not on the inference path.
    "/nomikos_inference/export",
]

[dependency-groups]
# Training stack. A PEP 735 group rather than an optional-dependency extra: the
# root project now publishes `nomikos-inference`, and an extra would make
# `pip install nomikos-inference[train]` a supported way to pull transformers,
# accelerate and torchvision onto a researcher's laptop. Nothing that trains a
# model is part of what runs one. Use `uv run --group train`.
train = [
    "accelerate>=1.13.0",
    "jiwer>=4.0.0",
    "pillow>=12.3.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.11.0",
]
# Artifact production, not artifact execution (ADR 0006).
# `nomikos_inference/export/` traces the
# trained PyTorch graph into the `.onnx` the runtime loads, so this is where
# Torch lives now: on a maintainer's machine, at the moment weights are
# published, and nowhere near `[project].dependencies`. `safetensors` is here
# for the same reason - it is the native BLLA checkpoint format the exporter
# reads, and nothing under `nomikos_inference/` opens it any more.
export = [
    "onnx>=1.17.0",
    "safetensors>=0.5.0",
    "torch>=2.10.0",
]
dev = [
    "mypy>=2.3.0",
    "nbstripout>=0.8.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.21",
]
# Test runner only. Kept separate (PEP 735 include-group) so a service group can
# pull in the runner without every service group re-declaring pytest, and so the
# production groups can leave it out.
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Coverage measurement, configured in [tool.coverage] below. Deliberately
    # not wired into CI and deliberately not gated on a threshold: the CI budget
    # does not have room for a second full run of a suite that stands up
    # Postgres and loads real Torch weights, and a number nobody can afford to
    # measure is a number nobody should be blocked on. It is here so that
    # "which branch of this is untested?" is a question with an answer:
    #
    #   uv run --group test --group platform --group inference \
    #     pytest tests/nomikos --cov --cov-report=term-missing
    "pytest-cov>=6.0.0",
]
# Shared FastAPI/pydantic surface of every Python service in the repo.
service-core = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]
# The `helper` group is gone with the modules it existed for (#60). It named
# what the loopback HTTP surfaces needed on top of the published runtime, and
# there is no longer anything under `nomikos_inference/` that serves HTTP.
#
# What is left is what `tests/inference` needs in order to have a *platform* to
# drive the CLI against: the integration tests stand up a real uvicorn process
# on the platform's own `create_app()` and point `nomikos pair` / `nomikos
# run` at it. None of it reaches a researcher - that is [project].dependencies,
# which is now the single statement of what does.
#
# NOTE: the model runtime itself (numpy / onnxruntime / pillow / scikit-image /
# scipy / shapely / opencv-python-headless / huggingface-hub) lives in
# [project].dependencies, so this group must be installed with
# `--group inference`, never `--only-group`.
inference = [
    { include-group = "service-core" },
    # Floor clears CVE-2025-4565 / CVE-2026-0994.
    "protobuf>=5.29.6",
    "uvicorn[standard]>=0.32.0",
]
load-testing = [
    "locust>=2.45.0",
]
# Production platform image (no test runner, no OpenCV). Carries its own ASGI
# server: unlike the Vercel bundle, a container has to serve itself.
platform-prod = [
    { include-group = "service-core" },
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.18",
    # Secret-strength estimation for JWT_SECRET. Dropbox's zxcvbn, the Python port
    # the upstream authors point at. MIT, ~880 KB, and it runs once at settings
    # load, so it costs the Vercel bundle size but no request latency.
    "zxcvbn>=4.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pillow>=12.3.0",
    "reportlab>=5.0.0",
    # Polygon coverage in the segment merge (a re-segment must not redraw a line a
    # human kept). Also a runtime dependency of the model stack in
    # [project].dependencies, which this image deliberately does not install.
    "shapely>=2.1.0",
    "supabase>=2.13.0",
    # `CMD ["uvicorn", ...]` in nomikos/Dockerfile needs this on PATH. Vercel
    # supplied the server process; a container has to bring its own.
    "uvicorn[standard]>=0.32.0",
]
# Nomikos platform API + Postgres + tests (deps only, repo is not installed as a package)
platform = [
    { include-group = "platform-prod" },
    { include-group = "test" },
    "alembic>=1.14.0",
    "opencv-python-headless>=4.8,<4.13",
    "pypdf>=6.13.2",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

# The CPU-only Torch build, for the `train` and `export` groups. CUDA wheels
# dominate the download and are useless for tracing a graph on a maintainer's
# laptop; PyPI's macOS wheels are already CPU only, so the explicit index is
# pinned on the platforms where they are not.
#
# Under ADR 0004 this same pin had to be re-stated by the *user*, because Torch
# was in `[project].dependencies` and `tool.uv.sources` is ignored when a
# package is consumed from a registry - hence the documented
# `uv tool install nomikos-inference --torch-backend=cpu`, and a uv >= 0.10
# floor to go with it, because 0.7.x accepts `UV_TORCH_BACKEND=cpu` and then
# ignores it. ADR 0006 deletes that whole problem rather than documenting it
# better: `onnxruntime` publishes one CPU wheel per platform, there is no CUDA
# variant to accidentally resolve, and the install command is now just
#
#     uv tool install nomikos-inference
#
# This block now pins only *this repository's* lock, which is the scope
# `tool.uv.sources` could ever actually enforce.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poe.tasks]
migrate = { shell = "cd ${NOMIKOS_APP_ROOT:-nomikos} && alembic -c infrastructure/alembic.ini upgrade head" }
serve = { shell = "cd ${NOMIKOS_APP_ROOT:-nomikos} && uvicorn backend.core.main:app --host 0.0.0.0 --port 8000 --workers 1" }
api = { sequence = ["migrate", "serve"] }
# `--group test` is named explicitly on every task: the inference group carries
# no pytest, so omitting it silently falls back to whatever `pytest` is on PATH
# (unpinned) or fails outright.
test-fast = { shell = "uv run --group test --group platform --group inference pytest tests/nomikos/unit" }
test-integration = { shell = "uv run --group test --group platform --group inference pytest tests/nomikos -m integration" }
# The ml lane lives entirely under tests/inference now: the platform no longer
# runs a model, it hands a page to an agent that does.
test-ml = { shell = "uv run --group test --group platform --group inference pytest tests/inference -m ml" }
test-inference = { shell = "uv run --group test --group platform --group inference pytest tests/inference" }
# The export tree is the only thing in this repository that still needs Torch
# (ADR 0006), so it is the only task that names the `export` group.
test-export = { shell = "uv run --group test --group inference --group export pytest tests/export" }
test-hf = { shell = "uv run --group test --group inference pytest tests/hf" }

[tool.pytest.ini_options]
# `--strict-markers` turns an unknown marker into a collection error instead of
# a warning nobody reads. Without it `@pytest.mark.integraton` registers as
# nothing at all, and the test it decorates is no longer excluded from the unit
# lane - it runs there, against no database, and fails for a reason that looks
# nothing like the typo that caused it.
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["nomikos", "."]
asyncio_mode = "auto"
testpaths = ["tests/nomikos", "tests/inference", "tests/export", "tests/hf"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: requires Postgres",
    "ml: runs real BLLA/Calamari weights (slow)",
]

# ---------------------------------------------------------------------------
# Coverage. Configuration only - no `--cov` in `addopts`, and no threshold
# anywhere, so nothing here changes what any existing command does. Turn it on
# per run:
#
#   pytest tests/nomikos --cov --cov-report=term-missing
#
# Scope is the two trees that ship, matching [tool.mypy].files. `src/` is
# vendored research code that is not linted or type-checked either, `scripts/`
# is operator tooling, and `tests/` covering itself is a tautology.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["nomikos/backend", "nomikos_inference"]
branch = true
# The integration suite runs the app in a TestClient thread and the platform job
# worker in the lifespan task; without this, everything either of them executes
# reads as uncovered.
concurrency = ["thread"]
parallel = true
omit = [
    "*/__init__.py",
    # Alembic revisions are executed by `alembic upgrade`, not by pytest, and
    # `test_migrations.py` asserts on the schema they produce rather than on
    # their statements.
    "nomikos/infrastructure/alembic/*",
    # Torch-only export tooling. It is not published in the wheel and is not
    # type-checked either; `tests/export` skips wholesale when torch is absent,
    # so counting it here would report a coverage number that depends on which
    # dependency group happens to be installed.
    "nomikos_inference/export/*",
]

[tool.coverage.paths]
# `parallel = true` writes one data file per process; these have to be collapsed
# onto one set of names before a report can be produced.
backend = ["nomikos/backend", "*/nomikos/backend"]
nomikos_inference = ["nomikos_inference", "*/nomikos_inference"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The import roots, matching `tool.pytest.ini_options.pythonpath` and
# `tool.mypy.mypy_path` exactly. These are what `backend.*`, `infrastructure.*`,
# `nomikos_inference.*`, `scripts.*`, and `tests.*` resolve against at runtime, so they
# are what isort must resolve against to call an import first-party. The
# previous value named the packages (`nomikos/backend`, `nomikos_inference`) rather
# than the roots that contain them, so nothing resolved: `nomikos_inference` and
# `infrastructure` were classified third-party and sorted in among `PIL` and
# `sqlalchemy`. The I001 suppression below hid that for as long as it existed.
src = ["nomikos", "."]
# CI and pre-commit invoke `ruff check .` so new top-level directories are linted
# by default instead of silently escaping an explicit path list. These trees are
# vendored, generated, or build output. (.venv, dist, and node_modules are
# already in ruff's default excludes.)
extend-exclude = [
    ".lgraph",
    # Retired subsystems, kept readable as they were. See archive/*/README.md.
    "archive",
    "data",
    "infrastructure/platform/nomikos_inference",
    "infrastructure/platform/nomikos",
    # The whole research tree, not `src/experiments` alone. It is vendored code
    # nobody is maintaining to a lint standard, and it carried 555 findings that
    # said nothing about the application. Excluding it here rather than listing
    # per-directory ignores means a new subdirectory under `src/` is covered the
    # day it appears. An earlier version of this list named individual research
    # subdirectories instead, and silently missed every one added after it was
    # written.
    #
    # This is a suppression and only a suppression. The findings are real; they
    # are recorded in docs/resume-inference-redesign.md. Everything outside `src/`
    # is linted with no exemptions beyond the per-file-ignores below.
    "src",
    # TrOCR research code, moved out of src/ wholesale and not maintained.
    "trocr",
]

[tool.ruff.lint]
# F: correctness. I: import sorting. UP: pyupgrade. B: bugbear. SIM: simplify.
# S: flake8-bandit, i.e. bandit's checks running inside the linter that already
# hard-gates pre-commit and CI. A separate SAST job is a job somebody has to
# remember to look at; this fails the same build as a syntax error.
select = ["F", "I", "UP", "B", "SIM", "S"]

# B008 flags a function call in an argument default because the call runs once,
# at def time, and every caller then shares the one object. FastAPI's whole
# dependency-injection protocol is built on exactly that: `Depends(...)`,
# `Query(...)` and `File(...)` are markers the framework reads off the signature,
# never mutable state. Naming them here keeps B008 live for a real
# `def f(x=[])`, which a blanket per-tree `B008` ignore would not.
#
# Exactly the three that appear in an argument default today. Anything else -
# `Body`, `Form`, `Header`, `Cookie`, `Security` - is either unused or already
# written `Annotated[T, Header(...)]`, which B008 does not flag at all. Add to
# this list only after checking the callable really is a FastAPI marker.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

# ---------------------------------------------------------------------------
# This table used to hold a per-tree debt block - B905, I001, SIM*, UP*, F401,
# B008 suppressed across `nomikos_inference`, `nomikos`, `scripts` and `tests` - with a
# comment saying every entry should be fixed and deleted. Those entries are now
# fixed and deleted. What is left is policy, and each row says why it is right
# rather than why it is temporary.
#
# The bar for a new row: the rule is wrong *for every file the pattern matches*,
# for a reason you can write in one sentence. A rule that is wrong at three
# specific sites gets three `# noqa: RULE - reason` comments instead, so that a
# fourth site still has to justify itself. Everything outside these rows is
# linted with no exemptions; `src/` is not linted at all, see `extend-exclude`.
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
# S101 (assert): a test is a program made of assertions. `python -O` strips
# them, and running a test suite under `-O` is not a thing anybody does - which
# is exactly why the four asserts this rule found in *shipping* code were real
# bugs and were rewritten as explicit raises rather than added to a list.
#
# S105/S106 (hardcoded password): every match is a fixture credential - a test
# JWT secret, a fake device token, a login password the test itself just
# registered. The rule matches on identifier names, not entropy, so it cannot
# tell a fixture from a leak either way; real leaked-secret detection is a
# secret scanner's job, not this rule's.
#
# S603/S607 (subprocess, partial path): the CLI integration tests exist to run
# the CLI as a real process. `[sys.executable, "-m", "nomikos_inference.cli", ...]` is
# the thing under test, and the "untrusted input" is the test's own argv.
#
# S310 (URL open): these drive a loopback stub HTTP server the test started, on
# a URL the test built. The production `urlopen` calls in `nomikos_inference/cli/api.py`
# stay covered - they carry per-site `# noqa: S310` naming the scheme check that
# makes them safe.
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Type checking. The frontend has run `tsc --noEmit` in CI since day one; the
# Python side had nothing, which meant the `# type: ignore` comments scattered
# through the backend were verified by exactly nothing.
#
# This is deliberately NOT `strict = true`, and the CI step deliberately runs
# with `continue-on-error: true`. A checker that turns the build red on day one
# against an untyped codebase gets switched off within a week; one that prints a
# shrinking number every build gets adopted. Tighten the knobs below (and drop
# the continue-on-error) as the count comes down, not before.
#
# Scope is `nomikos/backend` and `nomikos_inference` only: the service code that ships.
# `src/` (research + vendored Calamari), `scripts/`, and `tests/` are out.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Bare `mypy` checks the same tree CI does. CI still names the paths explicitly.
files = ["nomikos/backend", "nomikos_inference"]
# Runtime resolves `backend.*` with `nomikos` on sys.path (see
# tool.pytest.ini_options.pythonpath); mypy needs the same two roots or every
# first-party import inside nomikos/backend reads as missing.
mypy_path = ["nomikos", "."]
namespace_packages = true
explicit_package_bases = true
# Imported-but-unchecked modules are analysed for their types but never report
# errors of their own. This is what keeps the scope above honest: importing the
# vendored tree cannot dump its errors into this build.
follow_imports = "silent"
# Blunt, and intentionally so for the first pass: most runtime deps here ship no
# stubs, and several hundred `import-untyped` lines would bury the real signal.
# Replace with per-module overrides once the baseline is down.
ignore_missing_imports = true
# The one non-default that earns its noise: without it, mypy skips the body of
# every unannotated function, which is most of them, and reports almost nothing.
check_untyped_defs = true
warn_redundant_casts = true
# The point of the exercise: prove the existing `# type: ignore` comments still
# suppress something real.
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# Off for now. These are the next knobs to turn on, roughly in this order.
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
# `nomikos_inference/export/` (the Torch graphs and the ONNX exporters) is inside
# `files` but is Torch-only tooling off the inference path, so it is excluded by
# name to keep the checked scope what it has always been.
#
# The vendored Calamari fork (now `src/models/calamari_tf/`) used to be named
# here too. It bought nothing: `files` covers `nomikos/backend` and
# `nomikos_inference` only, nothing in those two trees imports anything under
# `src/`, and dropping the entry leaves the checked-file count and the error
# list identical (236 files, 41 errors in 13 files).
exclude = ["^nomikos_inference/export/"]

[[tool.mypy.overrides]]
module = ["nomikos_inference.export.*"]
follow_imports = "skip"
ignore_errors = true
