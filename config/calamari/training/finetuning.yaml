# @package _global_

training:
  mode: finetune
  # Required at runtime, for example:
  # training.checkpoint=checkpoints/calamari/pretrained/on_armenian/<run>/best.pt
  checkpoint: null
  epochs: 100
  batch_size: 32
  num_workers: 16
  seed: 1111
  device: auto
  ema_decay: 0.99  #! need to look into this
  checkpoint_top_k: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.09
  early_stopping_patience: 20  # epochs without eval_cer improvement before stopping; null = disabled
  early_stopping_min_delta: 0.00001  # improvement must exceed this absolute eval_cer (0-1 fraction): 0.001 % CER
