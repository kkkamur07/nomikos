# @package _global_

training:
  epochs: 150
  batch_size: 32
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 16
  seed: 1111
  max_steps: -1
  no_fp16: false
  save_strategy: epoch
  checkpoint_top_k: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  max_grad_norm: 5.0
  warmup_ratio: 0.09
  lr_scheduler_type: cosine
  # Stop once eval CER stalls; evaluation runs once per epoch.
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.00001
