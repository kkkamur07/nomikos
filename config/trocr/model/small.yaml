# @package _global_
#
# Small ViT encoder alternative to model/default; the training recipe is
# unchanged, only the pretrained backbone differs.

model:
  name: microsoft/trocr-small-handwritten
  checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
  freeze_encoder: false

encoder:
  name: small

decoder:
  # all = scratch decoder, token_layers = new embeddings only, none = keep TrOCR's
  reinitialize: token_layers
  tied: false
  dropout: 0.1

lora_adaptors:
  enabled: false
  rank: 8
  alpha_rank_ratio: 2.0
  dropout: 0.05
  num_layers: 4
  target_modules: [query, value]
