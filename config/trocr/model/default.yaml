# @package _global_
#
# Base ViT encoder with full fine-tuning: the Calamari counterpart trains every
# weight, so the encoder stays unfrozen and LoRA adaptors stay disabled.

model:
  name: microsoft/trocr-base-handwritten
  checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
  freeze_encoder: false

encoder:
  name: base

decoder:
  # all = scratch decoder, token_layers = new embeddings only, none = keep TrOCR's
  reinitialize: token_layers
  tied: false
  dropout: 0.1

lora_adaptors:
  enabled: false
  rank: 8
  alpha_rank_ratio: 2.0
  dropout: 0.05
  num_layers: 4
  target_modules: [query, value]
